services:
  backend:
    build: ./backend
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      CORS_ORIGINS: '["http://localhost:8080"]'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
